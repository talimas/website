# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Talita's Town
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: talita.town
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      title:
        name: Silkscreen
        weights: [400]
      header:
        name: Jacquard 24
        weights: [400]
      body:
        name: Karla
        weights: [400, 500, 600, 700]
        includeItalic: true
      code: Geist Mono
    colors:
      lightMode:
        light: "#B2B9F9"
        lightgray: "#8E96E6"
        gray: "#3E4280"
        darkgray: "#1E2152"
        dark: "#1E2152"
        secondary: "#3A3DA8"
        tertiary: "#A82672"
        highlight: "#C8F169AA"
        textHighlight: "#E0915A77"
      darkMode:
        light: "#1A1B45"
        lightgray: "#3A3D85"
        gray: "#A3A8DC"
        darkgray: "#E6E7FA"
        dark: "#B2B9F9"
        secondary: "#C8F169"
        tertiary: "#F5A3D0"
        highlight: "#B2B9F92E"
        textHighlight: "#FFE58A40"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    options:
      maxDepth: 6
    order: 50
    layout:
      position: left
      priority: 20
  - source: ./plugins/talita-quartz-toc
    enabled: false
    order: 55
    layout:
      position: left
      priority: 20
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: googleFonts
      title:
        name: Silkscreen
        weights: [400]
      header:
        name: Jacquard 24
        weights: [400]
      body:
        name: Karla
        weights: [400, 500, 600, 700]
        includeItalic: true
      code:
        name: Geist Mono
        weights: [400, 600]
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: Street directory
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 4
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: false
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: ./plugins/town-masthead
    enabled: true
    # One building per section. A lot whose slug has no page yet is drawn but not linked.
    options:
      lots:
        - { building: hall, name: Town Hall, label: home, slug: index }
        - { building: press, name: The Press, label: journal, slug: journal }
        - { building: square, name: The Square, label: thoughts, slug: thoughts }
        - { building: workshop, name: The Workshop, label: projects, slug: workshop }
        - { building: greenhouse, name: The Greenhouse, label: garden, slug: garden }
        - { building: house, name: Visitor Centre, label: about, slug: about }
    layout:
      position: footer
      priority: 10
  - source: ./plugins/town-census
    enabled: true
    layout:
      position: left
      priority: 60
  - source: ./plugins/town-crier
    enabled: true
    # Filler text for now: replace with your own, or remove the options to hide the block.
    options:
      status: lorem ipsum dolor
      items:
        - { label: reading, text: Sit amet consectetur }
        - { label: building, text: Adipiscing elit sed }
        - { label: hearing, text: do eiusmod tempor }
    layout:
      position: right
      priority: 40
layout:
  groups:
    toolbar:
      priority: 5
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
    tag:
      exclude:
        - reader-mode
    canvas: {}
    bases: {}
